# EN: Home Assistant Dashboard for Online Grid LFP 3.6 (Bilingual EN / UA)
# UA: Панель керування Home Assistant для Online Grid LFP 3.6 (Двомовна EN / UA)
views:
  - title: Main / Головна
    path: main
    icon: mdi:home
    type: sidebar
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: entity
            entity: sensor.online_grid_lfp_3_6_system_status
            name: System Status / Статус Системи
            icon: mdi:information-outline
          - type: markdown
            title: Operating Mode / Режим Роботи
            content: >-
              {% set sw = states('binary_sensor.online_grid_lfp_3_6_online_sw') %}
              {% set led = states('switch.online_grid_lfp_3_6_led_online_sw') %}
              {% if sw == 'on' and led == 'on' %}
                <ha-icon icon="mdi:check-circle" style="color: green"></ha-icon> **Manual ATS Locked (Active) / Ручний режим АВР активний**
              {% elif sw == 'on' and led == 'off' %}
                <ha-icon icon="mdi:alert-circle" style="color: orange"></ha-icon> **Standby (Waiting for Transition) / Очікування переходу**
              {% elif sw == 'off' %}
                <ha-icon icon="mdi:minus-circle" style="color: grey"></ha-icon> **Auto ATS Mode / Автоматичний режим АВР**
              {% else %}
                <ha-icon icon="mdi:help-circle" style="color: red"></ha-icon> **Unknown / Невідомо**
              {% endif %}
          - type: gauge
            entity: sensor.online_grid_lfp_3_6_state_of_charge
            name: State of Charge (SOC) / Заряд АКБ
            min: 0
            max: 100
            severity:
              green: 30
              yellow: 15
              red: 0
          - type: entities
            title: Power & Energy / Енергія
            entities:
              - entity: sensor.online_grid_lfp_3_6_total_voltage
                name: Total Voltage / Загальна напруга
              - entity: sensor.online_grid_lfp_3_6_current
                name: Current / Струм
              - entity: sensor.online_grid_lfp_3_6_power
                name: Power / Потужність
              - entity: sensor.online_grid_lfp_3_6_chrg_voltage_status
                name: Charge Voltage Mode / Режим напруги заряду
      - type: entities
        title: Grid & Inverter / Мережа та Інвертор
        entities:
          - entity: binary_sensor.online_grid_lfp_3_6_230v_grid
            name: 230V Grid / Мережа 230В
          - entity: binary_sensor.online_grid_lfp_3_6_230v_inverter
            name: 230V Inverter / Інвертор 230В
          - entity: binary_sensor.online_grid_lfp_3_6_online_status
            name: BMS Online / Зв'язок з BMS
  - title: Battery / Акумулятор
    path: battery
    icon: mdi:battery-high
    type: masonry
    cards:
      - type: entities
        title: Battery Health / Стан Батареї
        entities:
          - entity: sensor.online_grid_lfp_3_6_capacity_remaining
            name: Capacity Remaining / Залишок ємності
          - entity: sensor.online_grid_lfp_3_6_full_charge_capacity
            name: Full Charge Capacity / Повна ємність
          - entity: sensor.online_grid_lfp_3_6_charging_cycles
            name: Charging Cycles / Цикли заряду
          - entity: binary_sensor.online_grid_lfp_3_6_charging
            name: Charging Allowed / Заряд дозволено
          - entity: binary_sensor.online_grid_lfp_3_6_discharging
            name: Discharging Allowed / Розряд дозволено
          - entity: binary_sensor.online_grid_lfp_3_6_balancing
            name: Balancing Active / Балансування
      - type: entities
        title: Cell Voltages / Напруга Комірок
        entities:
          - entity: sensor.online_grid_lfp_3_6_min_cell_voltage
            name: Min Cell Voltage / Мін. напруга комірки
          - entity: sensor.online_grid_lfp_3_6_max_cell_voltage
            name: Max Cell Voltage / Макс. напруга комірки
          - entity: sensor.online_grid_lfp_3_6_average_cell_voltage
            name: Average Cell Voltage / Сер. напруга комірки
          - entity: sensor.online_grid_lfp_3_6_delta_cell_voltage
            name: Delta Cell Voltage / Дельта напруги
          - entity: sensor.online_grid_lfp_3_6_cell_voltage_1
            name: Cell 1 / Комірка 1
          - entity: sensor.online_grid_lfp_3_6_cell_voltage_2
            name: Cell 2 / Комірка 2
          - entity: sensor.online_grid_lfp_3_6_cell_voltage_3
            name: Cell 3 / Комірка 3
          - entity: sensor.online_grid_lfp_3_6_cell_voltage_4
            name: Cell 4 / Комірка 4
  - title: Cooling / Охолодження
    path: cooling
    icon: mdi:fan
    type: masonry
    cards:
      - type: entities
        title: Temperature Sensors / Датчики Температури
        entities:
          - entity: sensor.online_grid_lfp_3_6_temperature_charger
            name: Charger Temp / Температура Зарядки
          - entity: sensor.online_grid_lfp_3_6_temperature_invertor
            name: Inverter Temp / Температура Інвертора
          - entity: sensor.online_grid_lfp_3_6_temperature_cell
            name: Cell Temp / Температура Комірок
          - entity: sensor.online_grid_lfp_3_6_temperature_wire
            name: Wire Temp / Температура Проводів
          - entity: sensor.online_grid_lfp_3_6_mosfet_temperature
            name: MOSFET Temp / Температура MOSFET
      - type: entities
        title: Fan Status / Стан Вентилятора
        entities:
          - entity: sensor.online_grid_lfp_3_6_fan_pwm_speed
            name: Fan PWM Speed / Швидкість PWM вентилятора
      - type: custom:expander-card
        title: Cooling Settings / Налаштування Охолодження
        cards:
          - type: entities
            entities:
              - entity: number.online_grid_lfp_3_6_fan_t_min
                name: Fan T Min / Мін. температура
              - entity: number.online_grid_lfp_3_6_fan_t_max
                name: Fan T Max / Макс. температура
              - entity: number.online_grid_lfp_3_6_fan_t_hys
                name: Fan T Hysteresis / Гістерезис
              - entity: number.online_grid_lfp_3_6_fan_gamma
                name: Fan Gamma / Гамма кривої
              - entity: number.online_grid_lfp_3_6_fan_pwm_min
                name: Fan PWM Min / Мін. оберти PWM
              - entity: number.online_grid_lfp_3_6_fan_pwm_max
                name: Fan PWM Max / Макс. оберти PWM
              - entity: number.online_grid_lfp_3_6_fan_pwm_frequency
                name: Fan PWM Frequency / Частота PWM
  - title: Control / Керування
    path: control
    icon: mdi:tune
    type: masonry
    cards:
      - type: entities
        title: Relays & Outputs / Реле та Виходи
        show_header_toggle: false
        entities:
          - entity: switch.online_grid_lfp_3_6_chrg_voltage
            name: Charge Voltage Relay (K1) / Реле напруги заряду
            type: simple-entity
            tap_action:
              action: none
            hold_action:
              action: none
          - entity: switch.online_grid_lfp_3_6_invertor_relay
            name: Inverter Relay (K2) / Реле інвертора
            type: simple-entity
            tap_action:
              action: none
            hold_action:
              action: none
          - entity: switch.online_grid_lfp_3_6_ssr1_charge_power
            name: SSR1 Charger 230V / SSR1 Зарядка 230В
            type: simple-entity
            tap_action:
              action: none
            hold_action:
              action: none
      - type: entities
        title: LED Indicators / LED Індикатори
        show_header_toggle: false
        entities:
          - entity: switch.online_grid_lfp_3_6_led_power_sw
            name: LED 1 Power / Живлення
            type: simple-entity
            tap_action:
              action: none
            hold_action:
              action: none
          - entity: switch.online_grid_lfp_3_6_led_online_sw
            name: LED 2 Mode & Manual ATS / Режим та АВР
            type: simple-entity
            tap_action:
              action: none
            hold_action:
              action: none
          - entity: switch.online_grid_lfp_3_6_led_charger_sw
            name: LED 3 Charger / Зарядка
            type: simple-entity
            tap_action:
              action: none
            hold_action:
              action: none
          - entity: switch.online_grid_lfp_3_6_led_invertor_sw
            name: LED 4 Inverter / Інвертор
            type: simple-entity
            tap_action:
              action: none
            hold_action:
              action: none
      - type: entities
        title: Threshold Settings / Критичні Налаштування
        entities:
          - entity: number.online_grid_lfp_3_6_min_soc_to_charge
            name: Min SOC to Charge / Мін. SOC для заряду
          - entity: number.online_grid_lfp_3_6_critical_soc
            name: Critical SOC / Критичний SOC
          - entity: number.online_grid_lfp_3_6_critical_temperature
            name: Critical Temperature / Критична Температура
  - title: BMS Info & Reset / BMS Інфо та Скидання
    path: bms_info
    icon: mdi:shield-alert
    type: masonry
    cards:
      - type: entities
        title: Actions / Дії
        entities:
          - entity: button.online_grid_lfp_3_6_reset_bms_lockout
            name: Reset BMS Lockout / Скинути блокування BMS
          - entity: button.online_grid_lfp_3_6_retrieve_settings
            name: Retrieve Settings / Отримати налаштування
          - entity: button.online_grid_lfp_3_6_retrieve_device_info
            name: Retrieve Device Info / Отримати інфо пристрою
          - entity: button.online_grid_lfp_3_6_retrieve_logbook
            name: Retrieve Logbook / Отримати журнал
      - type: entities
        title: BMS Information / Інформація BMS
        entities:
          - entity: sensor.online_grid_lfp_3_6_errors
            name: BMS Errors / Помилки BMS
          - entity: sensor.online_grid_lfp_3_6_balancer_status
            name: Balancer Status / Статус балансира
          - entity: sensor.online_grid_lfp_3_6_total_runtime_formatted
            name: Total Runtime / Загальний час роботи
          - entity: switch.online_grid_lfp_3_6_enable_bluetooth_connection
            name: Bluetooth Connection / З'єднання Bluetooth
