alias: "LFP Charger: Overvoltage Protection (SSR1) / Зарядка LFP: Захист від перенапруги (SSR1)"
description: >-
  EN: Turns off SSR1 on grid overvoltage and turns it back on once voltage normalizes (only if physical switch sw3 is ON).
  UA: Вимикає SSR1 при високій напрузі та вмикає після нормалізації, якщо фізичний вимикач sw3 увімкнений.
mode: restart

trigger:
  # EN: 1. Grid voltage exceeded the upper threshold (e.g., 250 V for 3 seconds)
  #     Replace sensor.wi_fi_socet_napruga with your smart plug/meter voltage sensor ID.
  # UA: 1. Напруга перевищила верхній поріг (наприклад, 250 В протягом 3 сек)
  #     Замініть sensor.wi_fi_socet_napruga на ваш сенсор напруги розумної розетки.
  - platform: numeric_state
    entity_id: sensor.wi_fi_socet_napruga
    above: 250
    for:
      seconds: 3
    id: high_voltage

  # EN: 2. Override ESP32 1-minute startup timer if SSR1 turns on while voltage is still high
  # UA: 2. Захист від 1-хвилинного таймера ESP32: якщо SSR1 увімкнувся сам, а напруга зараз висока
  - platform: state
    entity_id: switch.online_grid_lfp_3_6_ssr1_charge_power
    to: "on"
    id: ssr_turned_on_while_high

  # EN: 3. Grid voltage returned to normal range (195 V .. 242 V) and remained stable for 1 minute
  # UA: 3. Напруга повернулася в норму (між 195 В та 242 В) і стабільна 1 хвилину
  - platform: numeric_state
    entity_id: sensor.wi_fi_socet_napruga
    above: 195
    below: 242
    for:
      minutes: 1
    id: normal_voltage

condition:
  # EN: Do not interfere if ESP32 Test Mode is active
  # UA: Не втручаємося, якщо на ESP32 увімкнено Test Mode
  - condition: state
    entity_id: switch.online_grid_lfp_3_6_test_mode
    state: "off"

action:
  - choose:
      # --- EN: CASE 1: TURN OFF ON HIGH VOLTAGE / UA: СЦЕНАРІЙ 1: ВИМКНЕННЯ ПРИ ВИСОКІЙ НАПРУЗІ ---
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: high_voltage
              - condition: and
                conditions:
                  - condition: trigger
                    id: ssr_turned_on_while_high
                  - condition: numeric_state
                    entity_id: sensor.wi_fi_socet_napruga
                    above: 250
        sequence:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.online_grid_lfp_3_6_ssr1_charge_power
                - switch.online_grid_lfp_3_6_led_charger_sw

      # --- EN: CASE 2: RESTORE WHEN VOLTAGE NORMALIZES / UA: СЦЕНАРІЙ 2: УВІМКНЕННЯ ПІСЛЯ НОРМАЛІЗАЦІЇ ---
      - conditions:
          - condition: trigger
            id: normal_voltage
          # EN: Physical switch sw3 (charger_sw) MUST be ON
          # UA: Головна умова: фізичний тумблер sw3 (charger_sw) має бути УВІМКНЕНИЙ
          - condition: state
            entity_id: binary_sensor.online_grid_lfp_3_6_charger_sw
            state: "on"
          # EN: 230V AC grid is physically present at the station input
          # UA: На вході станції фізично присутня мережа 230В
          - condition: state
            entity_id: binary_sensor.online_grid_lfp_3_6_230v_grid
            state: "on"
          # EN: SSR1 is currently OFF
          # UA: SSR1 зараз вимкнений
          - condition: state
            entity_id: switch.online_grid_lfp_3_6_ssr1_charge_power
            state: "off"
          # EN: System has no active errors (BMS Lockout, Overheat, Critical SOC, etc.)
          # UA: Система не в стані аварії (BMS Lockout, перегрів, критичний SOC тощо)
          - condition: state
            entity_id: sensor.online_grid_lfp_3_6_system_status
            state: "OK"
        sequence:
          - action: switch.turn_on
            target:
              entity_id:
                - switch.online_grid_lfp_3_6_ssr1_charge_power
                - switch.online_grid_lfp_3_6_led_charger_sw
