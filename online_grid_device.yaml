# EN: Relay outputs (K1, K2, SSR1), Button LED indicators (LED1-LED4), and Test Mode switch
# UA: Виходи реле (K1, K2, SSR1), світлодіоди кнопок (LED1-LED4) та перемикач Test Mode
switch:
  # EN: K1 Relay (GPIO22) — Charger Voltage Selection: OFF = 13.5V(float), ON = 14V(bulk)
  # UA: Реле К1 (GPIO22) — Вибір напруги зарядки: OFF = 13.5V(float), ON = 14V(bulk)
  - platform: gpio
    pin:
      number: GPIO22
      inverted: true
    name: "chrg_voltage"
    id: chrg_voltage
    on_turn_on:
      then:
        - text_sensor.template.publish:
            id: chrg_voltage_status
            state: "14V(bulk)"
    on_turn_off:
      then:
        - text_sensor.template.publish:
            id: chrg_voltage_status
            state: "13.5V(float)"
  # EN: K2 Relay (GPIO23) — Inverter Power Switch
  # UA: Реле К2 (GPIO23) — Увімкнення інвертора
  - platform: gpio
    pin:
      number: GPIO23
      inverted: true
    name: "invertor_relay"
    id: invertor_relay
  # EN: SSR1 Solid State Relay (GPIO21) — 230V AC supply to Charger PSU
  # UA: Твердотільне реле SSR1 (GPIO21) — Подача 230В на блок живлення зарядки
  - platform: gpio
    pin: GPIO21
    name: "SSR1 Charge Power"
    id: ssr1
  # EN: LED 1 (GPIO19) — Power button LED + DC-DC 5V power latch
  # UA: LED 1 (GPIO19) — Підсвітка кнопки живлення + утримання DC-DC 5В
  - platform: gpio
    pin: GPIO19
    name: "led_power_sw"
    id: led_power_sw
  # EN: LED 2 (GPIO18) — SW2 button LED + ATS Manual Mode trigger
  # UA: LED 2 (GPIO18) — Підсвітка кнопки SW2 + переведення АВР у ручний режим
  - platform: gpio
    pin: GPIO18
    name: "led_online_sw"
    id: led_online_sw
  # EN: LED 3 (GPIO17) — SW3 Charger button LED
  # UA: LED 3 (GPIO17) — Підсвітка кнопки зарядки SW3
  - platform: gpio
    pin: GPIO17
    name: "led_charger_sw"
    id: led_charger_sw
  # EN: LED 4 (GPIO16) — SW4 Inverter button LED
  # UA: LED 4 (GPIO16) — Підсвітка кнопки інвертора SW4
  - platform: gpio
    pin: GPIO16
    name: "led_invertor_sw"
    id: led_invertor_sw
  # EN: Test Mode — disables automation logic to allow manual testing of relays, LEDs, and fans
  # UA: Режим тестування — вимикає автоматику для ручної перевірки реле, світлодіодів та вентиляторів
  - platform: template
    name: "Test Mode"
    id: test_mode
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - logger.log: "TEST MODE ENABLED - all control logic disabled except led_power_sw"
        - script.stop: blink_charger_no_grid_script
        - script.stop: blink_charger_wait_1min_script
        - script.stop: blink_charger_grid_lost_script
        - script.stop: error_blink_invertor_script
        - script.stop: error_blink_temp_script
        - switch.turn_off: chrg_voltage
        - switch.turn_off: invertor_relay
        - switch.turn_off: ssr1
        - switch.turn_off: led_online_sw
        - switch.turn_off: led_charger_sw
        - switch.turn_off: led_invertor_sw
        - globals.set:
            id: inverter_turn_on_wait
            value: "false"
        - globals.set:
            id: bms_error_lockout
            value: "false"
        - text_sensor.template.publish:
            id: system_status
            state: "Test Mode"
    on_turn_off:
      then:
        - logger.log: "TEST MODE DISABLED - normal control logic resumed"
        - text_sensor.template.publish:
            id: system_status
            state: "OK"
  - platform: jk_bms_ble
    balancer:
      name: "balancer"
  - platform: ble_client
    ble_client_id: client0
    name: "enable bluetooth connection"
    id: ble_client_switch0

text_sensor:
  - platform: template
    name: "System Status"
    id: system_status
    icon: "mdi:information-outline"
    update_interval: never
  - platform: template
    name: "chrg_voltage_status"
    id: chrg_voltage_status
    icon: "mdi:battery-charging"
  - platform: jk_bms_ble
    errors:
      name: "errors"
      id: bms_errors
    errors_bitmask_hex:
      name: "errors bitmask hex"
      id: bms_errors_hex
    balancer_status:
      name: "balancer status"
    total_runtime_formatted:
      name: "total runtime formatted"
    software_version:
      name: "software version"
    hardware_version:
      name: "hardware version"
