# ==============================================================================
# Online Grid LFP 3.6 — ESPHome Configuration (Reverse ATS Wiring)
# EN: Reverse ATS Wiring: ATS Input 1 (Priority) = 230V Inverter, ATS Input 2 = 230V Grid
# UA: Реверсна схема АВР: Вхід 1 АВР (Основний) = Інвертор 230В, Вхід 2 АВР = Мережа 230В
# ==============================================================================

substitutions:
  name: online_grid_lfp_3_6
  device_description: "Monitor and control a JK-BMS via bluetooth & Online Grid (Reverse ATS: In1=Inverter, In2=Grid)"
  external_components_source: github://syssi/esphome-jk-bms@main
  protocol_version: JK02_32S

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  project:
    name: "syssi.esphome-jk-bms"
    version: 3.0.0
  on_boot:
    # EN: Priority 800 (earliest hardware init): set GPIO19 HIGH immediately to latch DC-DC 5V power supply
    # UA: Пріоритет 800 (найраніший старт): миттєво вмикаємо GPIO19 для самопідхвату DC-DC 5В живлення
    - priority: 800
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_19, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_19, 1);
            ESP_LOGI("boot", "GPIO19 (led_power_sw) set HIGH via direct register for power latch");
    # EN: Priority -10 (after components init): check BMS lockout, critical SOC, and restore operating mode
    # UA: Пріоритет -10 (після ініціалізації): перевірка блокування BMS, критичного SOC та стану тумблерів
    - priority: -10
      then:
        - switch.turn_on: led_power_sw
        - switch.turn_off: test_mode
        - text_sensor.template.publish:
            id: system_status
            state: "OK"
        - lambda: |-
            if (id(chrg_voltage).state) {
              id(chrg_voltage_status).publish_state("14V(bulk)");
            } else {
              id(chrg_voltage_status).publish_state("13.5V(float)");
            }
        - if:
            condition:
              lambda: 'return id(bms_error_lockout);'
            then:
              - logger.log: "BMS is in lockout state from a previous error. Ignoring switches."
              - text_sensor.template.publish:
                  id: system_status
                  state: "Error: BMS Lockout (Boot)"
              - script.execute: error_blink_temp_script
            else:
              - if:
                  condition:
                    lambda: 'return id(critical_soc).has_state() && id(state_of_charge).has_state() && id(state_of_charge).state < id(critical_soc).state;'
                  then:
                    - logger.log: "SOC is below critical at boot. Ignoring all switches."
                  else:
                    - script.execute: fan_startup_test_script
                    - if:
                        condition:
                          # EN: sw2 ON = BYPASS Mode / UA: sw2 увімкнено = Режим БАЙПАС
                          binary_sensor.is_on: online_sw
                        then:
                          - if:
                              condition:
                                binary_sensor.is_on: grid_230v
                              then:
                                # EN: Grid is present & Bypass mode selected: keep Inverter OFF (LED4 OFF),
                                #     lock ATS on Input 2 (Grid) via IO18 (LED2 ON).
                                #     Charger (SSR1 + 14V + LED3) will start automatically in charge_control_interval if SOC < min_soc_charge.
                                # UA: Є мережа і вибрано Байпас: інвертор не вмикаємо (LED4 вимк.), фіксуємо АВР на Вході 2 (Мережа) через IO18 (LED2 увімк.).
                                #     Зарядка увімкнеться автоматично в charge_control_interval, якщо SOC < min_soc_charge.
                                - switch.turn_off: invertor_relay
                                - switch.turn_off: led_invertor_sw
                                - switch.turn_on: led_online_sw
                              else:
                                # EN: No Grid at boot while in Bypass mode -> run from Inverter (ATS Auto = Input 1)
                                # UA: Мережі немає при старті в режимі Байпас -> працюємо від інвертора (АВР в Авто = Вхід 1)
                                - switch.turn_off: led_online_sw
                                - if:
                                    condition:
                                      binary_sensor.is_on: invertor_sw
                                    then:
                                      - script.execute: invertor_start_script
                                - if:
                                    condition:
                                      binary_sensor.is_on: charger_sw
                                    then:
                                      - script.execute: blink_charger_no_grid_script
                        else:
                          # EN: sw2 OFF = ONLINE Mode (ATS Auto, Priority Input 1 = Inverter)
                          # UA: sw2 вимкнено = Режим ОНЛАЙН (АВР в Авто, основний Вхід 1 = Інвертор)
                          - switch.turn_off: led_online_sw
                          - if:
                              condition:
                                binary_sensor.is_on: charger_sw
                              then:
                                - if:
                                    condition:
                                      binary_sensor.is_on: grid_230v
                                    then:
                                      - switch.turn_on: ssr1
                                      - switch.turn_on: led_charger_sw
                                    else:
                                      - script.execute: blink_charger_no_grid_script
                          - if:
                              condition:
                                binary_sensor.is_on: invertor_sw
                              then:
                                - script.execute: invertor_start_script

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 0s

# EN: reboot_timeout: 0s disables automatic reboot when Wi-Fi or Home Assistant is unreachable
# UA: reboot_timeout: 0s вимикає перезавантаження ESP32 при відсутності Wi-Fi або зв'язку з Home Assistant
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

# EN: Suspend BLE connection during OTA firmware update for stability
# UA: Призупиняємо Bluetooth-з'єднання під час OTA-оновлення прошивки
ota:
  platform: esphome
  on_begin:
    then:
      - globals.set:
          id: ota_in_progress
          value: "true"
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret bms_mac_address
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 5s
    id: bms0

# EN: Global state variables (`bms_error_lockout` is persisted in Flash across reboots)
# UA: Глобальні змінні стану (`bms_error_lockout` зберігається у Flash-пам'яті між перезавантаженнями)
globals:
  - id: ota_in_progress
    type: bool
    initial_value: "false"
  - id: bms_has_connected
    type: bool
    initial_value: "false"
  - id: bms_error_lockout
    type: bool
    initial_value: "false"
    restore_value: true
  - id: inverter_turn_on_wait
    type: bool
    initial_value: "false"
  - id: balancing_duration_seconds
    type: int
    initial_value: "0"
  - id: soc_shutdown_done
    type: bool
    initial_value: "false"
  - id: soc_was_above_threshold
    type: bool
    initial_value: "false"

# EN: 1-Wire bus for DS18B20 temperature sensors (Charger & Inverter heatsinks)
# UA: Шина 1-Wire для датчиків температури DS18B20 (радіатори зарядки та інвертора)
one_wire:
  - platform: gpio
    pin: GPIO33

# EN: 20 kHz PWM output for cooling fans
# UA: Вихід ШІМ (20 кГц) для керування корпусними вентиляторами
output:
  - platform: ledc
    pin: GPIO27
    id: pwm_fans_out
    frequency: 20000Hz

script:
  # EN: 3-second 100% fan spin-up test on boot
  # UA: 3-секундний стартовий тест вентиляторів на 100% при завантаженні
  - id: fan_startup_test_script
    then:
      - output.set_level:
          id: pwm_fans_out
          level: 1.0
      - lambda: 'id(fan_pwm_speed).publish_state(100.0);'
      - delay: 3s
      - component.update: temperature_charger
      - component.update: temperature_invertor

  # EN: Safe transition into BYPASS mode (ATS Input 2 = Grid):
  #     1. Release ATS Manual lock (Auto mode), turn off Inverter and LED 4.
  #     2. If battery does not need charging by SOC, turn off SSR1, 14V relay, and LED 3.
  #     3. Wait 3s for inverter 230V output to decay and ATS to transfer from Input 1 (Inverter) to Input 2 (Grid).
  #     4. Turn on IO18 (led_online_sw) to lock ATS in Manual mode on Grid and illuminate LED 2.
  # UA: Безпечний перехід у режим БАЙПАС (Вхід 2 АВР = Мережа):
  #     1. Знімає блокування АВР (Auto), вимикає інвертор та LED 4.
  #     2. Якщо зарядка по SOC не потрібна — вимикає SSR1, 14В та LED 3.
  #     3. Чекає 3с, поки зникне 230В інвертора і АВР перемкнеться з Входу 1 (Інвертор) на Вхід 2 (Мережа).
  #     4. Вмикає IO18 (led_online_sw): фіксує АВР у ручному режимі на Мережі та запалює LED 2.
  - id: enter_bypass_mode_script
    mode: restart
    then:
      - if:
          condition:
            switch.is_off: test_mode
          then:
            - globals.set:
                id: inverter_turn_on_wait
                value: "false"
            - script.stop: invertor_start_script
            - script.stop: error_blink_invertor_script
            - if:
                condition:
                  lambda: |-
                    bool need_charge = (id(state_of_charge).has_state() &&
                                        id(min_soc_charge).has_state() &&
                                        id(state_of_charge).state < id(min_soc_charge).state) ||
                                       id(chrg_voltage).state;
                    return !need_charge;
                then:
                  - script.stop: blink_charger_no_grid_script
                  - script.stop: blink_charger_wait_1min_script
                  - script.stop: blink_charger_grid_lost_script
                  - switch.turn_off: ssr1
                  - switch.turn_off: chrg_voltage
                  - switch.turn_off: led_charger_sw
            - if:
                condition:
                  or:
                    - switch.is_on: invertor_relay
                    - binary_sensor.is_on: inverter_230v
                then:
                  - switch.turn_off: led_online_sw
                  - switch.turn_off: invertor_relay
                  - switch.turn_off: led_invertor_sw
                  - delay: 3s
                else:
                  - switch.turn_off: invertor_relay
                  - switch.turn_off: led_invertor_sw
            - if:
                condition:
                  and:
                    - switch.is_off: test_mode
                    - binary_sensor.is_on: online_sw
                    - binary_sensor.is_on: grid_230v
                    - lambda: 'return !id(bms_error_lockout);'
                then:
                  - switch.turn_on: led_online_sw

  # EN: Blink LED 3 (1s ON / 1s OFF) when Charger switch (sw3) is ON but Grid 230V is absent at startup
  # UA: Блимання LED 3 (1с ВКЛ / 1с ВИКЛ), коли увімкнено sw3, але немає мережі 230В на старті
  - id: blink_charger_no_grid_script
    mode: restart
    then:
      - while:
          condition:
            and:
              - binary_sensor.is_on: charger_sw
              - not:
                  binary_sensor.is_on: grid_230v
              - switch.is_off: test_mode
          then:
            - switch.turn_on: led_charger_sw
            - delay: 1s
            - switch.turn_off: led_charger_sw
            - delay: 1s
      - if:
          condition:
            and:
              - binary_sensor.is_on: charger_sw
              - binary_sensor.is_on: grid_230v
          then:
            - if:
                condition:
                  or:
                    - not:
                        binary_sensor.is_on: online_sw
                    - lambda: |-
                        return id(state_of_charge).has_state() &&
                               id(min_soc_charge).has_state() &&
                               id(state_of_charge).state < id(min_soc_charge).state;
                then:
                  - script.execute: blink_charger_wait_1min_script
                else:
                  - switch.turn_off: led_charger_sw

  # EN: 1-minute delay before turning on SSR1 after Grid 230V appears (blinks LED 3: 2s ON / 2s OFF)
  # UA: 1-хвилинна затримка перед увімкненням SSR1 після появи мережі 230В (блимає LED 3: 2с ВКЛ / 2с ВИКЛ)
  - id: blink_charger_wait_1min_script
    mode: restart
    then:
      - repeat:
          count: 15
          then:
            - if:
                condition:
                  and:
                    - binary_sensor.is_on: charger_sw
                    - binary_sensor.is_on: grid_230v
                    - switch.is_off: test_mode
                then:
                  - switch.turn_on: led_charger_sw
                  - delay: 2s
                  - switch.turn_off: led_charger_sw
                  - delay: 2s
                else:
                  - script.stop: blink_charger_wait_1min_script
      - if:
          condition:
            and:
              - binary_sensor.is_on: charger_sw
              - binary_sensor.is_on: grid_230v
              - switch.is_off: test_mode
          then:
            - if:
                condition:
                  or:
                    # EN: In Online mode (sw2 OFF), always turn on Charger PSU
                    # UA: В Онлайн-режимі (sw2 OFF) вмикаємо БЖ завжди
                    - not:
                        binary_sensor.is_on: online_sw
                    # EN: In Bypass mode (sw2 ON), turn on Charger PSU only if SOC < Min SOC to Charge
                    # UA: В Байпас-режимі (sw2 ON) вмикаємо БЖ тільки якщо потрібен заряд по SOC
                    - lambda: |-
                        return id(state_of_charge).has_state() &&
                               id(min_soc_charge).has_state() &&
                               id(state_of_charge).state < id(min_soc_charge).state;
                then:
                  - switch.turn_on: ssr1
                  - switch.turn_on: led_charger_sw
                  - if:
                      condition:
                        lambda: |-
                          return id(state_of_charge).has_state() &&
                                 id(min_soc_charge).has_state() &&
                                 id(state_of_charge).state < id(min_soc_charge).state;
                      then:
                        - switch.turn_on: chrg_voltage
                else:
                  - switch.turn_off: ssr1
                  - switch.turn_off: led_charger_sw
                  - switch.turn_off: chrg_voltage

  # EN: Blink LED 3 (1s ON / 3s OFF) when Grid 230V is lost during operation
  # UA: Блимання LED 3 (1с ВКЛ / 3с ВИКЛ), коли мережа 230В зникла під час роботи
  - id: blink_charger_grid_lost_script
    mode: restart
    then:
      - while:
          condition:
            and:
              - binary_sensor.is_on: charger_sw
              - not:
                  binary_sensor.is_on: grid_230v
              - switch.is_off: test_mode
          then:
            - switch.turn_on: led_charger_sw
            - delay: 1s
            - switch.turn_off: led_charger_sw
            - delay: 3s
      - if:
          condition:
            and:
              - binary_sensor.is_on: charger_sw
              - binary_sensor.is_on: grid_230v
          then:
            - if:
                condition:
                  or:
                    - not:
                        binary_sensor.is_on: online_sw
                    - lambda: |-
                        return id(state_of_charge).has_state() &&
                               id(min_soc_charge).has_state() &&
                               id(state_of_charge).state < id(min_soc_charge).state;
                then:
                  - script.execute: blink_charger_wait_1min_script
                else:
                  - switch.turn_off: led_charger_sw

  # EN: Inverter startup sequence: turn on K2 relay, wait 5s, verify 230V inverter output
  # UA: Запуск інвертора: увімкнення реле К2, очікування 5с, перевірка наявності 230В на виході інвертора
  - id: invertor_start_script
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: test_mode
          then:
            - logger.log: "Test mode active, invertor logic skipped"
      - if:
          condition:
            switch.is_off: test_mode
          then:
            - globals.set:
                id: inverter_turn_on_wait
                value: "true"
            - switch.turn_on: invertor_relay
            - delay: 5s
            - if:
                condition:
                  binary_sensor.is_on: inverter_230v
                then:
                  - switch.turn_on: led_invertor_sw
                  - globals.set:
                      id: inverter_turn_on_wait
                      value: "false"
                else:
                  - switch.turn_off: invertor_relay
                  - globals.set:
                      id: inverter_turn_on_wait
                      value: "true"

  # EN: Fast blink LED 4 (500ms) on inverter fault or discharge overload
  # UA: Швидке блимання LED 4 (500 мс) при аварії інвертора або перевантаженні по розряду
  - id: error_blink_invertor_script
    mode: restart
    then:
      - while:
          condition:
            switch.is_off: test_mode
          then:
            - switch.toggle: led_invertor_sw
            - delay: 500ms

  # EN: Alternating blink LED 3 <-> LED 4 (500ms) on critical temperature or BMS lockout
  # UA: Поперемінне блимання LED 3 <-> LED 4 (500 мс) при критичному перегріві або блокуванні BMS
  - id: error_blink_temp_script
    mode: restart
    then:
      - while:
          condition:
            switch.is_off: test_mode
          then:
            - switch.turn_on: led_charger_sw
            - switch.turn_off: led_invertor_sw
            - delay: 500ms
            - switch.turn_off: led_charger_sw
            - switch.turn_on: led_invertor_sw
            - delay: 500ms

interval:
  - interval: 1s
    id: inverter_blink_interval
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(inverter_turn_on_wait);'
              - binary_sensor.is_on: invertor_sw
              - switch.is_off: test_mode
          then:
            - switch.toggle: led_invertor_sw

  - interval: 1s
    id: soc_critical_check
    then:
      - if:
          condition:
            lambda: 'return id(state_of_charge).has_state() && id(critical_soc).has_state() && id(state_of_charge).state >= id(critical_soc).state;'
          then:
            - globals.set:
                id: soc_was_above_threshold
                value: "true"
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - lambda: |-
                  if (id(state_of_charge).has_state() && id(critical_soc).has_state()) {
                    return id(state_of_charge).state < id(critical_soc).state;
                  }
                  return false;
          then:
            - if:
                condition:
                  for:
                    time: 20s
                    condition:
                      not:
                        binary_sensor.is_on: grid_230v
                then:
                  - script.stop: enter_bypass_mode_script
                  - switch.turn_off: led_power_sw
                  - switch.turn_off: led_online_sw
                  - switch.turn_off: led_charger_sw
                  - switch.turn_off: led_invertor_sw
                  - switch.turn_off: chrg_voltage
                  - switch.turn_off: invertor_relay
                  - switch.turn_off: ssr1
                  - globals.set:
                      id: soc_shutdown_done
                      value: "true"
                  - text_sensor.template.publish:
                      id: system_status
                      state: "Error: Critical SOC (Boot)!"
                  - script.stop: blink_charger_no_grid_script
                  - script.stop: blink_charger_wait_1min_script
                  - script.stop: blink_charger_grid_lost_script

  - interval: 5s
    id: soc_unconditional_shutdown
    then:
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - lambda: |-
                  return (id(state_of_charge).has_state() && id(critical_soc).has_state() &&
                          id(state_of_charge).state < id(critical_soc).state &&
                          id(soc_was_above_threshold));
          then:
            - script.stop: enter_bypass_mode_script
            - switch.turn_off: led_power_sw
            - switch.turn_off: led_online_sw
            - switch.turn_off: led_charger_sw
            - switch.turn_off: led_invertor_sw
            - switch.turn_off: chrg_voltage
            - switch.turn_off: invertor_relay
            - switch.turn_off: ssr1
            - globals.set:
                id: soc_shutdown_done
                value: "true"
            - text_sensor.template.publish:
                id: system_status
                state: "Error: Critical SOC Drop!"
            - script.stop: blink_charger_no_grid_script
            - script.stop: blink_charger_wait_1min_script
            - script.stop: blink_charger_grid_lost_script

  # EN: Charge & Bypass power management loop (every 5s)
  # UA: Цикл керування зарядкою та живленням БЖ у режимах Онлайн і Байпас (кожні 5с)
  - interval: 5s
    id: charge_control_interval
    then:
      # EN: In Bypass mode (sw2 ON) with Grid present and sw3 ON: automatically wake up Charger if SOC drops below Min SOC to Charge
      # UA: Якщо система в Байпасі (sw2 ON), є мережа і увімкнено sw3, але SSR1 вимкнений, а SOC < Min SOC to Charge — вмикаємо зарядку
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - binary_sensor.is_on: online_sw
              - binary_sensor.is_on: charger_sw
              - binary_sensor.is_on: grid_230v
              - switch.is_off: ssr1
              - lambda: 'return !id(bms_error_lockout) && id(system_status).state.find("Error") == std::string::npos;'
              - lambda: |-
                  return (id(state_of_charge).has_state() &&
                          id(min_soc_charge).has_state() &&
                          id(state_of_charge).state < id(min_soc_charge).state);
              - not:
                  script.is_running: blink_charger_wait_1min_script
          then:
            - switch.turn_on: ssr1
            - switch.turn_on: led_charger_sw
            - switch.turn_on: chrg_voltage

      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - switch.is_on: ssr1
              - binary_sensor.is_on: grid_230v
              - lambda: 'return id(system_status).state.find("Error") == std::string::npos;'
          then:
            - if:
                condition:
                  lambda: |-
                    return (id(state_of_charge).has_state() && 
                            id(min_soc_charge).has_state() &&
                            id(state_of_charge).state < id(min_soc_charge).state);
                then:
                  - switch.turn_on: chrg_voltage
            - if:
                condition:
                  lambda: |-
                    return (id(state_of_charge).has_state() && id(state_of_charge).state >= 100.0 &&
                            id(delta_cell_voltage).has_state() && id(delta_cell_voltage).state < 0.01);
                then:
                  - globals.set:
                      id: balancing_duration_seconds
                      value: !lambda 'return id(balancing_duration_seconds) + 5;'
                  - if:
                      condition:
                        lambda: 'return id(balancing_duration_seconds) >= 900;'
                      then:
                        - switch.turn_off: chrg_voltage
                        # EN: In Bypass mode (sw2 ON), completely turn off SSR1 and LED 3 once charging & balancing finish
                        # UA: У режимі Байпас (sw2 ON) після завершення заряду повністю вимикаємо SSR1 і LED 3
                        - if:
                            condition:
                              binary_sensor.is_on: online_sw
                            then:
                              - switch.turn_off: ssr1
                              - switch.turn_off: led_charger_sw
                else:
                  - globals.set:
                      id: balancing_duration_seconds
                      value: '0'
                  # EN: In Bypass mode (sw2 ON), if 14V bulk charge is not active and SOC >= Min SOC to Charge, keep SSR1 & LED 3 OFF
                  # UA: Якщо в режимі Байпас (sw2 ON) активний заряд 14В не йде і SOC >= Min SOC to Charge — тримаємо SSR1 та LED 3 вимкненими
                  - if:
                      condition:
                        and:
                          - binary_sensor.is_on: online_sw
                          - switch.is_off: chrg_voltage
                          - lambda: |-
                              return (id(state_of_charge).has_state() &&
                                      id(min_soc_charge).has_state() &&
                                      id(state_of_charge).state >= id(min_soc_charge).state);
                      then:
                        - switch.turn_off: ssr1
                        - switch.turn_off: led_charger_sw
          else:
            - if:
                condition:
                  switch.is_off: test_mode
                then:
                  - switch.turn_off: chrg_voltage
                  - globals.set:
                      id: balancing_duration_seconds
                      value: '0'

  # EN: Main safety & error monitoring loop (runs every 2 seconds)
  # UA: Основний цикл моніторингу помилок та захистів (кожні 2 секунди)
  - interval: 2s
    id: error_monitor
    then:
      - if:
          condition:
            switch.is_off: test_mode
          then:
            - if:
                condition:
                  and:
                    - lambda: 'return !id(bms_error_lockout) && !id(ota_in_progress);'
                    - or:
                        - lambda: 'return id(ble_client_switch0).state && (id(bms_has_connected) || millis() > 60000) && !id(bms_online_status).state;'
                        - lambda: 'return id(ssr1).state && id(bms_charging_allowed).has_state() && !id(bms_charging_allowed).state;'
                        - lambda: 'return id(invertor_relay).state && id(bms_discharging_allowed).has_state() && !id(bms_discharging_allowed).state;'
                then:
                  - globals.set:
                      id: bms_error_lockout
                      value: "true"
                  - script.stop: enter_bypass_mode_script
                  - switch.turn_off: ssr1
                  - switch.turn_off: chrg_voltage
                  - switch.turn_off: invertor_relay
                  - switch.turn_off: led_online_sw
                  - switch.turn_off: led_charger_sw
                  - switch.turn_off: led_invertor_sw
                  - text_sensor.template.publish:
                      id: system_status
                      state: !lambda |-
                        if (id(ssr1).state && id(bms_charging_allowed).has_state() && !id(bms_charging_allowed).state) {
                          return "Error: BMS Charge Cutoff!";
                        } else if (id(invertor_relay).state && id(bms_discharging_allowed).has_state() && !id(bms_discharging_allowed).state) {
                          return "Error: BMS Discharge Cutoff!";
                        } else {
                          return "Error: BMS Offline!";
                        }
                  - script.execute: error_blink_temp_script
            # EN: Continuous Bypass state sync (IO18 / led_online_sw): ensures led_online_sw is ON whenever sw2 & Grid 230V are ON
            # UA: Постійна синхронізація стану Байпас (IO18 / led_online_sw): гарантує увімкнення led_online_sw, коли увімкнені sw2 та Мережа 230В
            - if:
                condition:
                  and:
                    - lambda: 'return !id(bms_error_lockout);'
                    - binary_sensor.is_on: online_sw
                    - binary_sensor.is_on: grid_230v
                then:
                  - if:
                      condition:
                        and:
                          - or:
                              - switch.is_off: led_online_sw
                              - switch.is_on: invertor_relay
                          - not:
                              script.is_running: enter_bypass_mode_script
                      then:
                        - script.execute: enter_bypass_mode_script
                else:
                  - if:
                      condition:
                        switch.is_on: led_online_sw
                      then:
                        - switch.turn_off: led_online_sw
            - if:
                condition:
                  not:
                    binary_sensor.is_on: grid_230v
                then:
                  - lambda: 'if (id(system_status).state != "Grid Lost" && id(system_status).state.find("Error") == std::string::npos) id(system_status).publish_state("Grid Lost");'
                else:
                  - lambda: 'if (id(system_status).state == "Grid Lost") id(system_status).publish_state("OK");'
            - if:
                condition:
                  and:
                    - switch.is_on: invertor_relay
                    - not:
                        binary_sensor.is_on: inverter_230v
                    - lambda: 'return !id(inverter_turn_on_wait);'
                then:
                  - switch.turn_off: invertor_relay
                  - text_sensor.template.publish:
                      id: system_status
                      state: "Error: Inverter Output Lost!"
                  - script.execute: error_blink_invertor_script
            - if:
                condition:
                  switch.is_on: chrg_voltage
                then:
                   - if:
                      condition:
                        lambda: |-
                          return (id(current).has_state() && id(current).state > 100.0) ||
                                 (id(total_voltage).has_state() && id(total_voltage).state > 14.2);
                      then:
                        - switch.turn_off: chrg_voltage
                        - text_sensor.template.publish:
                            id: system_status
                            state: "Error: Charge Overload!"
                        - delay: 2s
                        - if:
                            condition:
                              lambda: |-
                                return (id(current).has_state() && id(current).state > 100.0) ||
                                       (id(total_voltage).has_state() && id(total_voltage).state > 14.2);
                            then:
                              - switch.turn_off: ssr1
            - if:
                condition:
                  switch.is_on: invertor_relay
                then:
                  - if:
                      condition:
                        lambda: 'return id(current).has_state() && id(current).state < -120.0;'
                      then:
                        - switch.turn_off: invertor_relay
                        - text_sensor.template.publish:
                            id: system_status
                            state: "Error: Discharge Overload!"
                        - script.execute: error_blink_invertor_script
            - if:
                condition:
                  lambda: |-
                    float t1 = id(temperature_charger).has_state() ? id(temperature_charger).state : 0;
                    float t2 = id(temperature_invertor).has_state() ? id(temperature_invertor).state : 0;
                    float crit = id(critical_temp).has_state() ? id(critical_temp).state : 75.0;
                    return (t1 > crit || t2 > crit);
                then:
                  - script.stop: enter_bypass_mode_script
                  - switch.turn_off: ssr1
                  - switch.turn_off: chrg_voltage
                  - switch.turn_off: invertor_relay
                  - switch.turn_off: led_online_sw
                  - switch.turn_off: led_charger_sw
                  - switch.turn_off: led_invertor_sw
                  - text_sensor.template.publish:
                      id: system_status
                      state: "Error: Critical Temperature!"
                  - script.execute: error_blink_temp_script

binary_sensor:
  # EN: SW2 (GPIO36): ON = BYPASS Mode (Inverter OFF when Grid is present, Charger runs only on low SOC, IO18 locks ATS on Grid)
  #                   OFF = ONLINE Mode (Inverter & Charger run continuously, IO18 OFF -> ATS in Auto on Priority Input 1 = Inverter)
  # UA: SW2 (GPIO36): ON = Режим БАЙПАС (при наявності мережі інвертор вимкнено, зарядка тільки по SOC, IO18 фіксує АВР на мережі)
  #                   OFF = Режим ОНЛАЙН (інвертор та зарядка працюють постійно, IO18 вимкнено -> АВР в Авто на Вході 1 = Інвертор)
  - platform: gpio
    pin:
      number: GPIO36
      mode: INPUT
      inverted: true
    name: "online_sw"
    id: online_sw
    on_press:
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - lambda: 'return !id(bms_error_lockout);'
          then:
            - if:
                condition:
                  binary_sensor.is_on: grid_230v
                then:
                  - script.execute: enter_bypass_mode_script
    on_release:
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - lambda: 'return !id(bms_error_lockout);'
          then:
            # EN: Transition from Bypass to Online: release ATS Manual mode (IO18 OFF), start Inverter & Charger
            # UA: Перехід з Байпасу в Онлайн: знімаємо ручний режим АВР (IO18 OFF), запускаємо інвертор та зарядку
            - script.stop: enter_bypass_mode_script
            - switch.turn_off: led_online_sw
            - if:
                condition:
                  and:
                    - binary_sensor.is_on: invertor_sw
                    - switch.is_off: invertor_relay
                then:
                  - script.execute: invertor_start_script
            - if:
                condition:
                  binary_sensor.is_on: charger_sw
                then:
                  - if:
                      condition:
                        binary_sensor.is_on: grid_230v
                      then:
                        - if:
                            condition:
                              not:
                                script.is_running: blink_charger_wait_1min_script
                            then:
                              - switch.turn_on: ssr1
                              - switch.turn_on: led_charger_sw
                      else:
                        - script.execute: blink_charger_no_grid_script

  # EN: SW3 (GPIO39) — Charger Enable Switch
  # UA: SW3 (GPIO39) — Кнопка дозволу роботи зарядного пристрою
  - platform: gpio
    pin:
      number: GPIO39
      mode: INPUT
      inverted: true
    name: "charger_sw"
    id: charger_sw
    on_press:
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - lambda: 'return !id(bms_error_lockout);'
          then:
            - if:
                condition:
                  binary_sensor.is_on: grid_230v
                then:
                  - script.stop: blink_charger_no_grid_script
                  - script.stop: blink_charger_wait_1min_script
                  - script.stop: blink_charger_grid_lost_script
                  - text_sensor.template.publish:
                      id: system_status
                      state: "OK"
                  - if:
                      condition:
                        or:
                          - not:
                              binary_sensor.is_on: online_sw
                          - lambda: |-
                              return id(state_of_charge).has_state() &&
                                     id(min_soc_charge).has_state() &&
                                     id(state_of_charge).state < id(min_soc_charge).state;
                      then:
                        - switch.turn_on: ssr1
                        - switch.turn_on: led_charger_sw
                        - if:
                            condition:
                              lambda: |-
                                return id(state_of_charge).has_state() &&
                                       id(min_soc_charge).has_state() &&
                                       id(state_of_charge).state < id(min_soc_charge).state;
                            then:
                              - switch.turn_on: chrg_voltage
                      else:
                        - switch.turn_off: ssr1
                        - switch.turn_off: led_charger_sw
                        - switch.turn_off: chrg_voltage
                else:
                  - script.execute: blink_charger_no_grid_script
    on_release:
      - script.stop: blink_charger_no_grid_script
      - script.stop: blink_charger_wait_1min_script
      - script.stop: blink_charger_grid_lost_script
      - switch.turn_off: ssr1
      - switch.turn_off: led_charger_sw
      - switch.turn_off: chrg_voltage

  # EN: SW4 (GPIO34) — Inverter Enable Switch
  # UA: SW4 (GPIO34) — Кнопка дозволу роботи інвертора
  - platform: gpio
    pin:
      number: GPIO34
      mode: INPUT
      inverted: true
    name: "invertor_sw"
    id: invertor_sw
    on_press:
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - lambda: 'return !id(bms_error_lockout);'
          then:
            - text_sensor.template.publish:
                id: system_status
                state: "OK"
            - script.stop: error_blink_invertor_script
            - switch.turn_off: led_invertor_sw
            - if:
                condition:
                  or:
                    - not:
                        binary_sensor.is_on: online_sw
                    - not:
                        binary_sensor.is_on: grid_230v
                then:
                  - script.execute: invertor_start_script
    on_release:
      - globals.set:
          id: inverter_turn_on_wait
          value: "false"
      - script.stop: invertor_start_script
      - switch.turn_off: invertor_relay
      - switch.turn_off: led_invertor_sw
      - script.stop: error_blink_invertor_script

  # EN: 230V AC Grid Input Sensor (GPIO35)
  # UA: Датчик наявності вхідної мережі 230В (GPIO35)
  - platform: gpio
    pin:
      number: GPIO35
      mode: INPUT
      inverted: true
    name: "230V Grid"
    id: grid_230v
    on_release:
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - lambda: 'return !id(bms_error_lockout);'
          then:
            # EN: Grid lost: release ATS Manual lock (IO18 OFF), start Inverter (ATS switches to Input 1), blink Charger LED 3
            # UA: Зникла мережа: вимикаємо ручний режим АВР (IO18 OFF), вмикаємо інвертор (АВР переходить на Вхід 1), блимаємо LED 3
            - script.stop: enter_bypass_mode_script
            - switch.turn_off: led_online_sw
            - if:
                condition:
                  and:
                    - binary_sensor.is_on: invertor_sw
                    - switch.is_off: invertor_relay
                then:
                  - script.execute: invertor_start_script
            - if:
                condition:
                  binary_sensor.is_on: charger_sw
                then:
                  - switch.turn_off: ssr1
                  - switch.turn_off: chrg_voltage
                  - switch.turn_off: led_charger_sw
                  - script.stop: blink_charger_wait_1min_script
                  - script.execute: blink_charger_grid_lost_script
    on_press:
      - if:
          condition:
            and:
              - switch.is_off: test_mode
              - lambda: 'return !id(bms_error_lockout);'
          then:
            # EN: Grid restored: if sw2 (Bypass) is ON, stop Inverter, transfer ATS to Grid, lock IO18, and start Charger only if SOC < Min SOC
            # UA: Відновилася мережа: при увімкненому sw2 (Байпас) вимикаємо інвертор, фіксуємо АВР на мережі, зарядку вмикаємо лише при низькому SOC
            - if:
                condition:
                  binary_sensor.is_on: online_sw
                then:
                  - script.stop: blink_charger_no_grid_script
                  - script.stop: blink_charger_grid_lost_script
                  - if:
                      condition:
                        binary_sensor.is_on: charger_sw
                      then:
                        - if:
                            condition:
                              lambda: |-
                                return id(state_of_charge).has_state() &&
                                       id(min_soc_charge).has_state() &&
                                       id(state_of_charge).state < id(min_soc_charge).state;
                            then:
                              - switch.turn_off: led_charger_sw
                              - script.execute: blink_charger_wait_1min_script
                            else:
                              - script.stop: blink_charger_wait_1min_script
                              - switch.turn_off: ssr1
                              - switch.turn_off: chrg_voltage
                              - switch.turn_off: led_charger_sw
                  - script.execute: enter_bypass_mode_script
                else:
                  - if:
                      condition:
                        binary_sensor.is_on: charger_sw
                      then:
                        - script.stop: blink_charger_no_grid_script
                        - script.stop: blink_charger_grid_lost_script
                        - switch.turn_off: led_charger_sw
                        - script.execute: blink_charger_wait_1min_script

  # EN: 230V AC Inverter Output Sensor (GPIO32)
  # UA: Датчик наявності 230В на виході інвертора (GPIO32)
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT
      inverted: true
    name: "230V Inverter"
    id: inverter_230v

  - platform: jk_bms_ble
    balancing:
      name: "balancing"
    charging:
      name: "charging"
      id: bms_charging_allowed
    discharging:
      name: "discharging"
      id: bms_discharging_allowed
    online_status:
      name: "online status"
      id: bms_online_status
      filters:
        - delayed_off: 15s
      on_press:
        - globals.set:
            id: bms_has_connected
            value: "true"

button:
  - platform: template
    name: "Reset BMS Lockout"
    id: reset_bms_lockout
    icon: "mdi:lock-open-alert"
    on_press:
      then:
        - globals.set:
            id: bms_error_lockout
            value: "false"
        - text_sensor.template.publish:
            id: system_status
            state: "OK"
        - logger.log: "BMS Lockout reset by user."
        - script.stop: error_blink_temp_script
        - switch.turn_off: led_charger_sw
        - switch.turn_off: led_invertor_sw
  - platform: jk_bms_ble
    retrieve_settings:
      name: "retrieve settings"
    retrieve_device_info:
      name: "retrieve device info"
    retrieve_logbook:
      name: "retrieve logbook"

number:
  - platform: template
    name: "Min SOC to Charge"
    id: min_soc_charge
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: "10"
  - platform: template
    name: "Critical SOC"
    id: critical_soc
    min_value: 1
    max_value: 20
    step: 1
    optimistic: true
    restore_value: true
    initial_value: "6"
  - platform: template
    name: "Critical Temperature"
    id: critical_temp
    min_value: 40
    max_value: 90
    step: 1
    optimistic: true
    restore_value: true
    initial_value: "75"
  - platform: template
    name: "Fan T Min"
    id: fan_t_min
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: "35"
  - platform: template
    name: "Fan T Max"
    id: fan_t_max
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: "60"
  - platform: template
    name: "Fan T Hys"
    id: fan_t_hys
    min_value: 1
    max_value: 20
    step: 1
    optimistic: true
    restore_value: true
    initial_value: "2"
  - platform: template
    name: "Fan Gamma"
    id: fan_gamma
    min_value: 0.5
    max_value: 5.0
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: "3.0"
  - platform: template
    name: "Fan PWM Min"
    id: fan_pwm_min
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: "4"
  - platform: template
    name: "Fan PWM Max"
    id: fan_pwm_max
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: "100"
  - platform: template
    name: "Fan PWM Frequency"
    id: fan_pwm_freq
    min_value: 20
    max_value: 25000
    step: 1
    unit_of_measurement: "Hz"
    optimistic: true
    restore_value: true
    initial_value: "20000"
    on_value:
      then:
        - lambda: |-
            id(pwm_fans_out).update_frequency(x);
  - platform: template
    name: "Test PWM Slider"
    id: test_pwm_slider
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: false
    initial_value: "0"
    on_value:
      then:
        - if:
            condition:
              switch.is_on: test_mode
            then:
              - output.set_level:
                  id: pwm_fans_out
                  level: !lambda 'return x / 100.0;'
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balance_trigger_voltage:
      name: "balance trigger voltage"
    cell_count:
      name: "cell count"
    total_battery_capacity:
      name: "total battery capacity"
    cell_voltage_overvoltage_protection:
      name: "cell voltage overvoltage protection"
    cell_voltage_overvoltage_recovery:
      name: "cell voltage overvoltage recovery"
    cell_voltage_undervoltage_protection:
      name: "cell voltage undervoltage protection"
    cell_voltage_undervoltage_recovery:
      name: "cell voltage undervoltage recovery"
    balancing_start_voltage:
      name: "balancing start voltage"
    voltage_calibration:
      name: "voltage calibration"
    current_calibration:
      name: "current calibration"
    power_off_voltage:
      name: "power off voltage"
    max_balance_current:
      name: "max balance current"
    max_charge_current:
      name: "max charge current"
    max_discharge_current:
      name: "max discharge current"
    charge_overcurrent_protection_delay:
      name: "charge overcurrent protection delay"
    charge_overcurrent_protection_recovery_time:
      name: "charge overcurrent protection recovery time"
    discharge_overcurrent_protection_delay:
      name: "discharge overcurrent protection delay"
    discharge_overcurrent_protection_recovery_time:
      name: "discharge overcurrent protection recovery time"
    short_circuit_protection_delay:
      name: "short circuit protection delay"
    short_circuit_protection_recovery_time:
      name: "short circuit protection recovery time"
    charge_overtemperature_protection:
      name: "charge overtemperature protection"
    charge_overtemperature_protection_recovery:
      name: "charge overtemperature protection recovery"
    discharge_overtemperature_protection:
      name: "discharge overtemperature protection"
    discharge_overtemperature_protection_recovery:
      name: "discharge overtemperature protection recovery"
    charge_undertemperature_protection:
      name: "charge undertemperature protection"
    charge_undertemperature_protection_recovery:
      name: "charge undertemperature protection recovery"
    mosfet_overtemperature_protection:
      name: "mosfet overtemperature protection"
    mosfet_overtemperature_protection_recovery:
      name: "mosfet overtemperature protection recovery"

sensor:
  - platform: dallas_temp
    address: !secret dallas_charger_address
    name: "temperature_charger"
    id: temperature_charger
    update_interval: 15s
    on_value: &fan_control_action
      then:
        - if:
            condition:
              switch.is_on: test_mode
            then:
              - output.set_level:
                  id: pwm_fans_out
                  level: !lambda 'return id(test_pwm_slider).state / 100.0;'
              - lambda: 'id(fan_pwm_speed).publish_state(id(test_pwm_slider).state);'
        - if:
            condition:
              switch.is_off: test_mode
            then:
              - lambda: |-
                  float t1 = id(temperature_charger).has_state() ? id(temperature_charger).state : 0.0;
                  float t2 = id(temperature_invertor).has_state() ? id(temperature_invertor).state : 0.0;
                  float t_max_curr = max(t1, t2);
                  
                  float t_min = id(fan_t_min).state;
                  float t_max = id(fan_t_max).state;
                  float t_hys = id(fan_t_hys).state;
                  float pwm_min = id(fan_pwm_min).state / 100.0;
                  float pwm_max = id(fan_pwm_max).state / 100.0;
                  float gamma = id(fan_gamma).state;
                  
                  static float current_speed = 0.0;
                  
                  if (t_max_curr >= t_max) {
                      current_speed = 1.0;
                  } else if (t_max_curr >= t_min) {
                      float linear_pos = (t_max_curr - t_min) / (t_max - t_min);
                      if (linear_pos > current_speed) {
                          current_speed = linear_pos;
                      } else {
                          float hys_pos = t_hys / (t_max - t_min);
                          if (linear_pos <= (current_speed - hys_pos)) {
                              current_speed = linear_pos;
                          }
                      }
                  } else if (t_max_curr < (t_min - t_hys)) {
                      current_speed = 0.0;
                  }
                  
                  if (current_speed > 1.0) current_speed = 1.0;
                  if (current_speed < 0.0) current_speed = 0.0;
                  
                  float corrected;
                  if (current_speed <= 0.0) {
                      corrected = 0.0;
                  } else {
                      corrected = pwm_min + (pwm_max - pwm_min) * powf(current_speed, gamma);
                  }
                  
                  id(pwm_fans_out).set_level(corrected);
                  id(fan_pwm_speed).publish_state(corrected * 100.0);

