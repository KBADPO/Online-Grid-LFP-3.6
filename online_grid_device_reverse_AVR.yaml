sensor:
  - platform: dallas_temp
    address: !secret dallas_charger_address
    name: "temperature_charger"
    id: temperature_charger
    update_interval: 15s
    on_value: &fan_control_action
      then:
        - if:
            condition:
              switch.is_on: test_mode
            then:
              - output.set_level:
                  id: pwm_fans_out
                  level: !lambda 'return id(test_pwm_slider).state / 100.0;'
              - lambda: 'id(fan_pwm_speed).publish_state(id(test_pwm_slider).state);'
        - if:
            condition:
              switch.is_off: test_mode
            then:
              - lambda: |-
                  float t1 = id(temperature_charger).has_state() ? id(temperature_charger).state : 0.0;
                  float t2 = id(temperature_invertor).has_state() ? id(temperature_invertor).state : 0.0;
                  float t_max_curr = max(t1, t2);
                  
                  float t_min = id(fan_t_min).state;
                  float t_max = id(fan_t_max).state;
                  float t_hys = id(fan_t_hys).state;
                  float pwm_min = id(fan_pwm_min).state / 100.0;
                  float pwm_max = id(fan_pwm_max).state / 100.0;
                  float gamma = id(fan_gamma).state;
                  
                  static float current_speed = 0.0;
                  
                  if (t_max_curr >= t_max) {
                      current_speed = 1.0;
                  } else if (t_max_curr >= t_min) {
                      float linear_pos = (t_max_curr - t_min) / (t_max - t_min);
                      if (linear_pos > current_speed) {
                          current_speed = linear_pos;
                      } else {
                          float hys_pos = t_hys / (t_max - t_min);
                          if (linear_pos <= (current_speed - hys_pos)) {
                              current_speed = linear_pos;
                          }
                      }
                  } else if (t_max_curr < (t_min - t_hys)) {
                      current_speed = 0.0;
                  }
                  
                  if (current_speed > 1.0) current_speed = 1.0;
                  if (current_speed < 0.0) current_speed = 0.0;
                  
                  float corrected;
                  if (current_speed <= 0.0) {
                      corrected = 0.0;
                  } else {
                      corrected = pwm_min + (pwm_max - pwm_min) * powf(current_speed, gamma);
                  }
                  
                  id(pwm_fans_out).set_level(corrected);
                  id(fan_pwm_speed).publish_state(corrected * 100.0);

