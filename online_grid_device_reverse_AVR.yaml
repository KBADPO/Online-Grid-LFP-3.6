switch:
  - platform: gpio
    pin:
      number: GPIO22
      inverted: true
    name: "chrg_voltage"
    id: chrg_voltage
    on_turn_on:
      then:
        - text_sensor.template.publish:
            id: chrg_voltage_status
            state: "14V(bulk)"
    on_turn_off:
      then:
        - text_sensor.template.publish:
            id: chrg_voltage_status
            state: "13.5V(float)"
  - platform: gpio
    pin:
      number: GPIO23
      inverted: true
    name: "invertor_relay"
    id: invertor_relay
  - platform: gpio
    pin: GPIO21
    name: "SSR1 Charge Power"
    id: ssr1
  - platform: gpio
    pin: GPIO19
    name: "led_power_sw"
    id: led_power_sw
  - platform: gpio
    pin: GPIO18
    name: "led_online_sw"
    id: led_online_sw
  - platform: gpio
    pin: GPIO17
    name: "led_charger_sw"
    id: led_charger_sw
  - platform: gpio
    pin: GPIO16
    name: "led_invertor_sw"
    id: led_invertor_sw
  - platform: template
    name: "Test Mode"
    id: test_mode
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - logger.log: "TEST MODE ENABLED - all control logic disabled except led_power_sw"
        - script.stop: enter_bypass_mode_script
        - script.stop: blink_charger_no_grid_script
        - script.stop: blink_charger_wait_1min_script
        - script.stop: blink_charger_grid_lost_script
        - script.stop: error_blink_invertor_script
        - script.stop: error_blink_temp_script
        - switch.turn_off: chrg_voltage
        - switch.turn_off: invertor_relay
        - switch.turn_off: ssr1
        - switch.turn_off: led_online_sw
        - switch.turn_off: led_charger_sw
        - switch.turn_off: led_invertor_sw
        - globals.set:
            id: inverter_turn_on_wait
            value: "false"
        - globals.set:
            id: bms_error_lockout
            value: "false"
        - text_sensor.template.publish:
            id: system_status
            state: "Test Mode"
    on_turn_off:
      then:
        - logger.log: "TEST MODE DISABLED - normal control logic resumed"
        - text_sensor.template.publish:
            id: system_status
            state: "OK"
